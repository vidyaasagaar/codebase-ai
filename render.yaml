# Render Blueprint: full Codebase AI server (indexing, chat, graphs) with a persistent disk.
# Secrets marked `sync: false` are entered in the Render dashboard and never committed.
services:
  - type: web
    name: codebase-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 2 GB RAM: indexing peaks around 1.6 GB (embedding runtime + embedded PostgreSQL); 512 MB plans run out of memory.
    plan: standard
    healthCheckPath: /api/capabilities
    autoDeploy: true
    disk:
      name: codebase-ai-data
      mountPath: /app/.data
      sizeGB: 1
    envVars:
      - key: CODEBASE_AI_MODE
        value: full
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-5.6-luna
      - key: LLM_FALLBACK_MODELS
        value: cohere/north-mini-code:free
      - key: LLM_MAX_TOKENS
        value: "2000"
      - key: LLM_API_KEY
        sync: false
      - key: CODEBASE_AI_SECRET
        generateValue: true
